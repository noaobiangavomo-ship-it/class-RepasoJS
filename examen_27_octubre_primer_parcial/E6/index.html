<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6 - Array de empleados</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1e1e2e;
            color: #cdd6f4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: #313244;
            border-radius: 10px;
            padding: 2rem 2.5rem;
            max-width: 560px;
            width: 100%;
            border-left: 4px solid #f38ba8;
        }

        .badge {
            display: inline-block;
            background: #f38ba8;
            color: #1e1e2e;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        h1 {
            font-size: 1.25rem;
            color: #cdd6f4;
            margin-bottom: 0.4rem;
        }

        .pts {
            font-size: 0.9rem;
            color: #a6adc8;
            margin-bottom: 1.4rem;
        }

        .instruction {
            background: #1e1e2e;
            border-radius: 6px;
            padding: 1rem 1.2rem;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #bac2de;
        }

        .instruction code {
            background: #45475a;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 0.85em;
            color: #cba6f7;
        }

        .console-hint kbd {
            background: #45475a;
            border-radius: 3px;
            padding: 0.1rem 0.35rem;
            font-family: inherit;
            font-size: 0.85em;
            color: #cdd6f4;
        }
    </style>
</head>
<body>
<div class="card">
    <span class="badge">Ejercicio 6</span>
    <h1>Array de empleados</h1>
    <p class="pts">1,5 puntos — Dificultad: alta</p>
    <div class="instruction">
        Escribe tu solución en <code>ejercicio6.js</code>.<br>
        Los resultados se mostrarán en la consola del navegador.
    </div>
</div>
<script src="ejercicio6.js"></script>
</body>
</html>
